ings running before anyone joins: your node,\nwhose key is your identity in the program, and an open LEZ\nwallet, which holds your points account. The referral program\nmust also be available on this network. The next section shows\nthis step when nothing is ready.\n\n![The node and the wallet are both detected](images/uplink-ready.png)\n\nThe code is checked as it changes, so a wrong paste says why\nbefore anything is sent. A code from an inviter who hasn't\njoined, or your own, is refused the same way.\n\n![It's rejected as you paste it](images/uplink-join-invalid.png)\n\nThis is the mock's built-in inviter: a node that is already in\nthe program. Joining under it can't be changed later.\n\n![The invitation is accepted](images/uplink-join-invitation.png)\n\nJoining is signed with the node's key. Uplink never has it: it asks\nthe Blockchain app, which shows what it would sign and signs only\nwhen you approve. Here the mock node app approves at once.\n\nJoining creates a points account in the LEZ wallet, has the node\napp sign the registration, and submits it. Uplink checks back\nevery five seconds; once the registration\nhas settled, this is the last onboarding step. It also asks\nwhether to collect points automatically: on by default, and\nchangeable later in About.\n\n![Let the page settle](images/uplink-done.png)\n\nThe overview lists your node and each direct referral, with the\nlast 16 epochs of activity. The mock seeds three referrals when\nyou join. Points come from their activity, once the next epoch\nis published.\n\n![Let the referrals load](images/uplink-overview.png)\n\nYour own invitation. The person you invite pastes it into their\nJoin step; there's nothing for you to sign.\n\n![Let the dialog open](images/uplink-invite.png)\n\nIn epoch 2, two of the three referrals and your own node are\nactive, and a point of credit arrives from deeper in your tree:\nthree points.\n\nCashing out always takes the whole balance. It collects anything\nnot yet collected, cashes the balance out into a receipt that only\nyour node can find again (the Blockchain app hands over its receipt\nkey), and has the Blockchain app sign the receipt's details into a\npayout code.\n\n![Let the dialog open](images/uplink-claim.png)\n\nThe payout code goes into the web claim form, where payout and\nidentity details are added. **Treat it like a password:** the\ncode carries everything needed to claim this cash-out.\n\n![Let the code show](images/uplink-payout-code.png)\n\nIf the code wasn't copied \u2014 Uplink was closed, or the dialog was\ndismissed \u2014 it can be got again from here. The node app signs the\nsame receipt again, so it's the same code.\n\n![Let the dialog open](images/uplink-cash-outs.png)\n\n![Let the code show](images/uplink-payout-code-again.png)"}, {"execs": [], "md": "## Step 4: When the node and wallet aren't ready\n\nA second run, with no LEZ wallet open and the node stopped. The Ready step\nnames both problems, offers to open each app, and won't let the user on."}, {"execs": [{"actions": [{"description": "The app opens on the welcome page: wait for ['Join Uplink']", "index": 1, "status": "not_run"}, {"description": "Let the page settle: sleep 1500ms", "index": 2, "status": "not_run"}, {"description": "Start joining: click objectName='uplink.joinButton'", "index": 3, "status": "not_run"}, {"description": "Let the page settle: sleep 1500ms", "index": 4, "status": "not_run"}, {"description": "Scroll the terms to the end: call 'uplink.termsScroll'.flick(0, -100000)", "index": 5, "status": "not_run"}, {"description": "Let the scroll finish: sleep 2000ms", "index": 6, "status": "not_run"}, {"description": "Accept the terms: click objectName='uplink.termsCheckbox'", "index": 7, "status": "not_run"}, {"description": "Continue to the Ready step: click objectName='uplink.onboardingAdvanceButton'", "index": 8, "status": "not_run"}, {"description": "Let the page settle: sleep 1500ms", "index": 9, "status": "not_run"}, {"description": "Both problems are named: wait for ['YOUR NODE (NOT DETECTED)', 'YOUR LEZ WALLET (NOT OPEN)', 'Open Blockchain app', 'Open LEZ Wallet']", "index": 10, "status": "not_run"}, {"description": "\u2026and the user can't continue: expect objectName='uplink.onboardingAdvanceButton' .enabled == False", "index": 11, "status": "not_run"}, {"description": "The footer says why: expect objectName='uplink.onboardingAdvanceHint' .text == 'Your node and your LEZ wallet need to be ready.'", "index": 12, "status": "not_run"}], "cmd": "env UPLINK_LEZ=mock:no_wallet UPLINK_NODE=mock:not_running XDG_DATA_HOME=\"$PWD/uplink-data-not-ready\" nix run \"${UPLINK_FLAKE:-github:logos-co/logos-uplink-app/3ad73bbc4463c9afe3c744466e6e365eb69c2c50}\" --no-write-lock-file", "kind": "ui_test", "note": "inspector not available on port 3768 after 2400s", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\nthese 9 derivations will be built:\n  /nix/store/6bxii368z37r1vwgxpdb0dbm0v962yd0-logos-blockchain-c-deps-0.0.0.drv\n  /nix/store/pi2r0g9hcyd33dkir1rzli1a51rv3ynz-logos-blockchain-c-0.0.0.drv\n  /nix/store/jy5x4x28sxcgc4b0n975qn297a52x4gr-logos-blockchain_module-module-lib-0.0.999.drv\n  /nix/store/7l79fswrx841i0sbx2xnm4g2xqkka56d-logos-blockchain_module-module-lib-lgx-0.0.999.drv\n  /nix/store/f82ik50acqv6hl3c9ak5d6milfv099bb-logos-execution-zone-wallet-ffi-deps-0.1.0.drv\n  /nix/store/a8bjdv2g6gjrba91p5qg78pyjfiak1b2-logos-execution-zone-wallet-ffi-0.1.0.drv\n  /nix/store/haqhj2xm11515krhv75wdlybdvnh1fwc-logos-lez_core-module-lib-0.5.2.drv\n  /nix/store/aj97nc4aknz3pjnd1p0hc748gpgv1b48-logos-lez_core-module-lib-lgx-0.5.2.drv\n  /nix/store/bhg6qc0g6hpms5v7p15pzhwnn8y7agbp-run-logos-standalone-ui.drv\nbuilding '/nix/store/6bxii368z37r1vwgxpdb0dbm0v962yd0-logos-blockchain-c-deps-0.0.0.drv'...\nbuilding '/nix/store/f82ik50acqv6hl3c9ak5d6milfv099bb-logos-execution-zone-wallet-ffi-deps-0.1.0.drv'...\nbuilding '/nix/store/pi2r0g9hcyd33dkir1rzli1a51rv3ynz-logos-blockchain-c-0.0.0.drv'...\nbuilding '/nix/store/a8bjdv2g6gjrba91p5qg78pyjfiak1b2-logos-execution-zone-wallet-ffi-0.1.0.drv'...", "runner_cmd": "", "status": "fail"}], "md": "### 4.1 Launch with nothing ready\n\n```bash\nenv UPLINK_LEZ=mock:no_wallet UPLINK_NODE=mock:not_running XDG_DATA_HOME=\"$PWD/uplink-data-not-ready\" nix run \"${UPLINK_FLAKE:-github:logos-co/logos-uplink-app/3ad73bbc4463c9afe3c744466e6e365eb69c2c50}\" --no-write-lock-file\n```\n\nEach card says what's wrong and offers the app that fixes it.\nIn Basecamp those buttons open the Blockchain and LEZ Wallet\napps; the standalone app has no shell to open them in.\n\n![Both problems are named](images/uplink-not-ready.png)"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
